# Sovellus kirjautuu sovellusroolin käyttäjänä (kanta/migraatiot/V08), ei rootina.
# Salasana: ympäristömuuttuja WEBSTORE_DB_PASSWORD, oletuksena asenna.ps1:n kehityssalasana.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/webstore
spring.datasource.username=${WEBSTORE_DB_USER:webstore_app}
spring.datasource.password=${WEBSTORE_DB_PASSWORD:App_vaihda_2026!}

# Skeemaa hallitaan migraatioilla, ei Hibernatella.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Ajettavat SQL-lauseet näkyvät lokissa: --spring.profiles.active=sql
logging.level.fi.metropolia.webstore=INFO
