# Testit käyttävät muistinvaraista H2-kantaa MySQL-tilassa. MySQL-kohtaiset osat (liipaisimet,
# proseduurit, käyttöoikeudet) testataan MySqlIntegrationTestissä oikeaa kantaa vasten.
spring.datasource.url=jdbc:h2:mem:webstore-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:webstore-schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
